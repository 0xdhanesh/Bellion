services:
  tools:
    image: redocker:latest
    build:
      context: ..
      dockerfile: reDocker/Dockerfile
    stdin_open: true
    tty: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ulimits:
      fsize:
        soft: 16777216
        hard: 16777216
    volumes:
      - ./workspace:/workspace
